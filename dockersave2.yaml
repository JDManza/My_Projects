---
- name: Stop running containers and save latest two image tags per repo (no collections)
  hosts: all
  gather_facts: false
  vars:
    backup_dir: /var/backups/docker_images   # change if you like

  tasks:
    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: "0750"

    - name: Get IDs of running containers
      ansible.builtin.command: docker ps --filter "status=running" -q
      register: running_ctrs
      changed_when: false

    - name: Stop running containers (ignore if none)
      ansible.builtin.command: docker stop {{ item }}
      loop: "{{ running_ctrs.stdout_lines }}"
      when: running_ctrs.stdout | length > 0

    - name: List images (repo and tag)
      ansible.builtin.command: docker images --format "{{'{{.Repository}}'}} {{'{{.Tag}}'}}"
      register: images_raw
      changed_when: false

    - name: Build list of repo/tag (skip <none>)
      ansible.builtin.set_fact:
        images_list: >-
          {{
            (images_raw.stdout_lines | default([]))
            | reject('search', '^<none> ')
            | reject('search', ' <none>$')
            | map('split', ' ')
            | map('list')
            | map('community.general.dict_kv', 'repo', 'tag')    # fallback provided below if you don't have community.general
            | list
          }}
      vars:
        # Safe fallback for dict_kv without community.general:
        # (Uncomment these two lines and replace the map line above if you prefer no helper at all.)
        # images_list_tmp: "{{ (images_raw.stdout_lines | default([])) | reject('search', '^<none> ') | reject('search', ' <none>$') | list }}"
        # images_list: "{{ images_list_tmp | map('split',' ') | list | map('last') }}"
      # NOTE: If you truly want *zero* external filters, use the next task instead and remove this one.

    # Minimal, zero-extras way to build [{'repo':..., 'tag':...}] if you want to avoid ANY external filters:
    - name: Build repo/tag dicts without any extra collections
      ansible.builtin.set_fact:
        images_list: "{{ (images_list | default([])) + [ {'repo': (item.split(' ')[0]), 'tag': (item.split(' ')[1]) } ] }}"
      loop: "{{ images_raw.stdout_lines | default([]) }}"
      when: "'<none>' not in item"

    - name: Inspect created time for each repo:tag
      ansible.builtin.command: >
        docker image inspect -f {{'{{.Created}}'}} {{ item.repo }}:{{ item.tag }}
      register: inspected
      loop: "{{ images_list }}"
      changed_when: false
      failed_when: inspected is failed and (inspected.results | selectattr('rc','ne',0) | list | length) == (images_list | length)

    - name: Merge repo/tag with created timestamp
      ansible.builtin.set_fact:
        images_with_created: "{{ (images_with_created | default([])) + [
          {
            'repo': item.0.repo,
            'tag':  item.0.tag,
            'created': (item.1.stdout | to_datetime).strftime('%s') | int
          }
        ] }}"
      loop: "{{ images_list | zip(inspected.results) | list }}"

    - name: Pick two most recent tags per repo
      ansible.builtin.set_fact:
        images_to_save: >-
          {{
            (images_with_created | default([]))
            | groupby('repo')
            | map('last')                         # list per repo
            | map('sort', attribute='created')    # oldest->newest
            | map('reverse')                      # newest->oldest
            | map('slice', 2)                     # top 2
            | list
            | flatten
          }}

    - name: Save selected images to .tar files
      ansible.builtin.shell: >
        docker image save
        -o "{{ backup_dir }}/{{ item.repo | replace('/','_') }}-{{ item.tag | regex_replace('[^A-Za-z0-9_.-]','_') }}.tar"
        "{{ item.repo }}:{{ item.tag }}"
      args:
        creates: "{{ backup_dir }}/{{ item.repo | replace('/','_') }}-{{ item.tag | regex_replace('[^A-Za-z0-9_.-]','_') }}.tar"
      loop: "{{ images_to_save }}"
      changed_when: true

    - name: Summary of saved images
      ansible.builtin.debug:
        msg: "Saved {{ item.repo }}:{{ item.tag }} -> {{ backup_dir }}/{{ item.repo | replace('/','_') }}-{{ item.tag | regex_replace('[^A-Za-z0-9_.-]','_') }}.tar"
      loop: "{{ images_to_save }}"