---
- name: Stop running containers and save latest two image tags per repo (by tag, not timestamp)
  hosts: all
  gather_facts: false
  vars:
    backup_dir: /var/backups/docker_images

  tasks:
    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: "0750"

    - name: Get IDs of running containers
      ansible.builtin.command: docker ps --filter "status=running" -q
      register: running_ctrs
      changed_when: false

    - name: Stop running containers (ignore if none)
      ansible.builtin.command: docker stop {{ item }}
      loop: "{{ running_ctrs.stdout_lines }}"
      when: running_ctrs.stdout | length > 0

    - name: List images (repo and tag)
      ansible.builtin.command: docker images --format "{{'{{.Repository}}'}} {{'{{.Tag}}'}}"
      register: images_raw
      changed_when: false

    - name: Build repo/tag dicts (skip <none>)
      ansible.builtin.set_fact:
        images_list: "{{ (images_list | default([])) + [ {'repo': item.split(' ')[0], 'tag': item.split(' ')[1]} ] }}"
      loop: "{{ images_raw.stdout_lines | default([]) }}"
      when: "'<none>' not in item"

    - name: Group by repo and keep top 2 tags (lexicographic sort)
      ansible.builtin.set_fact:
        images_to_save: >-
          {{
            images_list
            | groupby('repo')
            | map('last')
            | map('sort', attribute='tag')   # simple string sort
            | map('reverse')
            | map('slice', 2)
            | list
            | flatten
          }}

    - name: Save selected images to .tar files
      ansible.builtin.shell: >
        docker image save
        -o "{{ backup_dir }}/{{ item.repo | replace('/','_') }}-{{ item.tag | regex_replace('[^A-Za-z0-9_.-]','_') }}.tar"
        "{{ item.repo }}:{{ item.tag }}"
      args:
        creates: "{{ backup_dir }}/{{ item.repo | replace('/','_') }}-{{ item.tag | regex_replace('[^A-Za-z0-9_.-]','_') }}.tar"
      loop: "{{ images_to_save }}"
      changed_when: true

    - name: Summary of saved images
      ansible.builtin.debug:
        msg: "Saved {{ item.repo }}:{{ item.tag }} -> {{ backup_dir }}/{{ item.repo | replace('/','_') }}-{{ item.tag | regex_replace('[^A-Za-z0-9_.-]','_') }}.tar"
      loop: "{{ images_to_save }}"